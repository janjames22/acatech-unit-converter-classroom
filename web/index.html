<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ACATECH Aviation College tools for unit conversion, scientific calculations, and local assessment support.">
  <meta name="application-name" content="ACATECH Aviation Tools">
  <meta name="theme-color" content="#176B5B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ACATECH Tools">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ACATECH Aviation Tools</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background: #ffffff;
    }

    body {
      margin: 0;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 24px;
      box-sizing: border-box;
      padding: 32px;
      color: #123d35;
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    #app-loading img {
      width: min(82vw, 600px);
      height: auto;
    }

    #app-loading p {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    #app-loading .loading-line {
      width: min(56vw, 240px);
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: #dbe8e4;
    }

    #app-loading .loading-line::after {
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #176b5b;
      content: "";
      animation: acatech-loading 1.2s ease-in-out infinite alternate;
    }

    @keyframes acatech-loading {
      from { transform: translateX(-5%); }
      to { transform: translateX(125%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading .loading-line::after {
        animation: none;
        transform: translateX(62%);
      }
    }
  </style>
</head>
<body>
  <main id="app-loading" role="status" aria-live="polite">
    <img src="branding/acatech-logo-full.png" alt="ACATECH Aviation College">
    <p>Loading ACATECH Aviation Tools…</p>
    <span class="loading-line" aria-hidden="true"></span>
  </main>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="pwa_install_bridge.js"></script>
  <script>
    window.addEventListener('flutter-first-frame', function removeLoadingBrand() {
      document.getElementById('app-loading')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <noscript>ACATECH Aviation Tools requires JavaScript.</noscript>
</body>
</html>
